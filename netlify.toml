[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Client-side routing fallback so React Router handles deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
