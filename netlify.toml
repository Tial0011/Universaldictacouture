[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Client-side routing fallback so React Router handles deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# Private workspace documents must not be cached/indexed or framed. These
# headers are staged only; a production deployment is separately authorized.
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Section 11 entry/proof/private documents. Staged; no production deployment.
